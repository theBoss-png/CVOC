# Baut die Web-Version und lädt sie bei jedem Push auf main zu Cloudflare hoch.
# Braucht zwei Repo-Secrets: CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID.
name: Deploy Web-Version

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Electron wird nur für die Desktop-App gebraucht, nicht für den Web-Build.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:web

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
